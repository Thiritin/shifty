name: Bug report
description: Report something that does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe what you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version or image tag
      placeholder: ghcr.io/thiritin/shifty:1.0.0
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [MariaDB, MySQL, PostgreSQL, SQLite]
