version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    groups:
      composer:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
