name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, pdo_sqlite, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan wayfinder:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: ESLint
        run: npx eslint .

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: PHPUnit
        run: php artisan test

      - name: Build assets
        run: npm run build

  databases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - connection: mariadb
            port: 3306
          - connection: pgsql
            port: 5432
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: shifty
          MARIADB_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect" --health-interval=5s --health-retries=10
      pgsql:
        image: postgres:17
        env:
          POSTGRES_DB: shifty
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: --health-cmd=pg_isready --health-interval=5s --health-retries=10
    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: shifty
      DB_USERNAME: ${{ matrix.connection == 'pgsql' && 'postgres' || 'root' }}
      DB_PASSWORD: secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, pdo_mysql, pdo_pgsql, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: PHPUnit
        run: php artisan test

  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: helm lint deploy/helm/shifty --set appKey=base64:test --set database.host=db
