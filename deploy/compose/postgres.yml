# Docs: docs/deployment.md
services:
  app:
    image: ghcr.io/thiritin/shifty:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: shifty
      DB_USERNAME: shifty
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: shifty
      POSTGRES_USER: shifty
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shifty"]
      interval: 10s
      retries: 10

volumes:
  db:
