{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shifty.fullname" . }}
  labels:
    {{- include "shifty.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_KEY: {{ required "Set appKey or existingSecret" .Values.appKey | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
{{- end }}
